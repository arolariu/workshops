# The agent-harness workshop on Linux, macOS and Windows: the harness's unit tests, and verify (every starter fails,
# every reference passes, the seeded chain is in sync, bringing work forward breaks nothing). No AI calls: checks that
# need the agent CLI, apm or gh-aw are skipped in verify mode on machines without them.
name: Agent harness workshop
on:
  push:
    paths: ['2026/agent-harness-workshop/**', '.github/workflows/agent-harness-workshop.yml']
  pull_request:
    paths: ['2026/agent-harness-workshop/**', '.github/workflows/agent-harness-workshop.yml']
permissions:
  contents: read
concurrency:
  group: agent-harness-workshop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: 2026/agent-harness-workshop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Unit tests
        run: node --test "labs/_harness/tests/*.test.mjs"
      - name: Every starter fails, every reference passes, the chain and bring hold
        run: node labs/start.mjs verify --chain --bring
